[package]
name = "tscode-app"
description = "Shared backend channels and transports"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"

[lib]
name = "tscode_app"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
dirs = { workspace = true }
fern = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `io-std` and `io-util` on top of the workspace set: the transport is stdin and
# stdout, and no other member reads them.
tokio = { workspace = true, features = ["io-std", "io-util"] }
tokio-util = { workspace = true }

tscode-fs = { path = "../tscode-fs" }
tscode-git = { path = "../tscode-git" }
tscode-pty = { path = "../tscode-pty" }
tscode-search = { path = "../tscode-search" }
tscode-sl = { path = "../tscode-sl" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
