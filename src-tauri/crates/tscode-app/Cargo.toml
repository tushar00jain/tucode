[package]
name = "tscode-app"
description = "tscode's Tauri app shell - the channel registry and the app setup"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"

[lib]
name = "tscode_app"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-log = { workspace = true }

async-trait = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

tscode-fs = { path = "../tscode-fs" }
tscode-git = { path = "../tscode-git" }
tscode-pty = { path = "../tscode-pty" }
tscode-search = { path = "../tscode-search" }
tscode-sl = { path = "../tscode-sl" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
