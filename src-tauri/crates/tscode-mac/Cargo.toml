[package]
name = "tscode-mac"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "macos")'.dependencies]
tscode-app = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
wry = { version = "=0.55.1", default-features = false, features = ["protocol", "devtools"] }
raw-window-handle = "0.6"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebViewConfiguration"] }
