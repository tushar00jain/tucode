[package]
name = "tscode-search"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "File and text search for tscode, built on ripgrep's ignore/grep crates."

[lib]
name = "tscode_search"
path = "src/lib.rs"

[dependencies]
tscode-fs = { path = "../tscode-fs" }
log = { workspace = true }

# ripgrep's own crates: same engine stock VS Code shells out to.
ignore = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
globset = "0.4"

serde = { version = "1", features = ["derive"] }
serde_repr = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
tokio = { workspace = true }
